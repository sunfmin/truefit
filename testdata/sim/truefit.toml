# The sample: a small queue simulated from a seed, with a bug some seeds reach.

[sim]
run = ["./sim"] # truefit appends the seed
seeds = 20      # new seeds per `truefit sim` (the default)

# The queue's design, model-checked by TLC; the simulation's runs are its
# traces: `./sim 1 > run.jsonl; truefit model --trace run.jsonl`.
[[model]]
name = "queue"
spec = "Queue.tla"
config = "Queue.cfg"
limit = 60 # seconds TLC may take on it
# The coverage record: the code each action stands for, as of `commit`.
commit = "42a65a58620cc50dc65af3c1ed5884a887984259"
covers = [
  { action = "ApplyAck", file = "queue.awk", function = "BEGIN: the step's \"apply m, ack\" branch" },
  { action = "ApplyCrash", file = "queue.awk", function = "BEGIN: the step's \"apply m, crash\" branch" },
  { action = "AppliedOnce", file = "queue.awk", function = "applied_once" },
]

# Each record's fields, as the model's variables (`r` is the record);
# `done` is left free: TLC tries every value the model allows.
[model.trace]
applied = "r.state.applied"
head = "r.state.next"

# The promises SPEC.md makes, each tied to the checks that keep it.
# `truefit promise` reports each; candidates are SPEC.md's sentences with a
# promise word ([promises] sources, by default SPEC.md, README.md, docs/adr/*.md).
[promises]
sources = ["SPEC.md"]

# Checked and reached: the simulation checks it on a redelivery (a step's
# `checked`), Queue.cfg checks AppliedOnce.
[[promise]]
name = "applied-once"
says = "A message is never applied twice, however often it is delivered."
source = "SPEC.md:6"
check = ["sim", "model queue"]

# Unreached: no step checks it by name and Queue.cfg checks no invariant of it.
[[promise]]
name = "no-lost-message"
says = "A crashed worker's message is never lost: the queue delivers it again."
source = "SPEC.md:7"
check = ["sim", "model queue"]

# Unchecked: no check keeps it.
[[promise]]
name = "head-in-range"
says = "Only the messages 1 to N are ever in the queue's head."
source = "SPEC.md:8"

# Kept: not checked here, and why.
[[promise]]
name = "seeded"
says = "Every run of the simulation is chosen from its seed alone."
source = "SPEC.md:9"
kept = "truefit holds it: `truefit sim` reruns each failing seed and fails one whose runs differ"
