[package]
name = "truefit"
version = "0.1.0"
edition = "2024"
description = "Keeps a system's tests and models true to the real system"
license = "MIT"
publish = false

[dependencies]
regex-lite = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
