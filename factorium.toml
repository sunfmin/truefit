# How factorium gates and cuts truefit (factorium SPEC.md §5).

[gate]
fast = "./gate.sh"
fast_limit = 600
slow = "./gate.sh"
slow_limit = 600

# A cut: packaging/release.sh builds the tag's version and publishes the
# archive and Formula/truefit.rb to the tap sunfmin/homebrew-tap; factorium
# tags HEAD and installs the formula.
[cut]
steps = ["packaging/release.sh cut $FACTORIUM_VERSION"]
formula = "sunfmin/tap/truefit"
limit = 1800

# slimfit's tasks and a sample of landed changes' mutants, then truefit's own
# (`truefit next --all`, built from the base's tip: the truefit being checked
# reads its own ties), filed as issues while the host is idle (SPEC §1.16).
[idle]
tasks = "slimfit --version && slimfit next --all --sample 5 && PATH=$HOME/.cargo/bin:$PATH cargo run --quiet --release -- next --all"
every = 86400
limit = 1800
